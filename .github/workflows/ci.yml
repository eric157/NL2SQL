name: NL2SQL CI & Build Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb fastapi uvicorn sqlglot pandas pydantic pydantic-settings pytest httpx

      - name: Build Analytical Dataset (Global Superstore)
        run: |
          python scripts/build_dataset.py

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          cd frontend
          npm ci || npm install
          npm run build
